<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <title>Bari Incidents Dashboard | Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="custom-grid.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.473.0/dist/umd/lucide.min.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
    <link rel="stylesheet" href="../output.css">

    
</head>

<body class="bg-black m-0 p-0 h-screen overflow-hidden text-white flex ml-50">
    
    
<div id="sidebar-container" class="h-full shrink-0"></div>
    <div class="flex-1 flex flex-col h-screen overflow-hidden pl-4">
        <header class="p-6 pb-0 flex justify-between items-center shrink-0">
            <h1 class="text-lg font-semibold tracking-wide text-white">Dashboard Overview</h1>
            <a href="changepass.html" class="px-3 py-1.5 bg-slate-600/10 hover:bg-slate-700 border border-slate-500/20 text-slate-200 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 cursor-pointer shadow-sm">
                <i data-lucide="key" class="w-3.5 h-3.5"></i> Change Password
            </a>
        </header>

        <main class="flex-1 p-6 overflow-y-auto scrollbar-none [&::-webkit-scrollbar]:hidden flex flex-col gap-6">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
                <div class="lg:col-span-7 bg-black border border-white/10 rounded-2xl p-5">
                    <div class="bg-neutral-950 border border-white/5 p-5 rounded-xl flex flex-col h-56 justify-between">
                        
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h3 class="text-sm font-semibold text-white tracking-wide">Purok Risk Level Chart</h3>
                                <p class="text-[10px] text-gray-500">Filters incident counts by timeframe</p>
                            </div>
                            <select id="chartTimeFilter" class="appearance-none bg-neutral-900 border border-white/10 text-xs text-gray-300 px-3 py-1.5 pr-8 rounded-lg focus:outline-none cursor-pointer">
                                <option value="all" selected>All Time Records</option>
                                <option value="week">This Week (Last 7 Days)</option>
                                <option value="month">This Month</option>
                                <option value="year">This Year</option>
                            </select>
                        </div>

                        <div id="purokChartContainer" class="flex items-end justify-center h-full gap-8 pt-2 border-b border-white/10 pb-1 w-full max-w-md mx-auto">
                        </div>

                    </div>
                </div>
    
                <div class="lg:col-span-5 bg-black border border-white/10 rounded-2xl p-5 flex flex-col justify-between min-h-56">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-medium text-white tracking-wide">On Duty Squad Status</h2>
                        <div class="relative">
                            <select id="purokDutySelector" class="appearance-none bg-neutral-900 text-xs text-gray-300 pl-3 pr-8 py-1.5 rounded border border-white/10 focus:outline-none cursor-pointer">
                                <option value="all" selected>All Sectors</option>
                                <option value="purok1">Purok uno</option>
                                <option value="purok2">Purok dos</option>
                                <option value="purok3">Purok tres</option>
                            </select>
                        </div>
                    </div>
                    <div id="dutyTeamList" class="flex flex-col gap-3 mt-4 h-full justify-start overflow-y-auto scrollbar-none">
                        <p class="text-xs text-gray-500 mt-2">Loading active deployment roster details...</p>
                    </div>
                </div>

            </div>

            <div class="bg-black border border-white/10 rounded-2xl p-6 shadow-xl">
                <h2 class="text-sm font-medium text-white tracking-wide mb-4">Barangay Incident Log Directory</h2>
                <div id="automated-table-wrapper"></div>
            </div>

        </main>
    </div>

  <script src="../js/sidebar.js"></script>
    <script src="../js/incident_table.js"></script>
    <script src="../js/purokchart.js"></script>
    <script src="../js/dashboard_patrols.js"></script>
    <script src="../js/changepass.js"></script>

    
    <div id="sidebar-container" class="h-full shrink-0"></div>
</body>
</html>
